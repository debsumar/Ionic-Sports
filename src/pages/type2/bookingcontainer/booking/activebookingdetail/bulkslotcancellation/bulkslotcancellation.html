<!--

  See http://ionicframework.com/docs/components/#navigation for more info on
  Ionic pages and navigation.
-->
<ion-header>

  <ion-navbar>
      <ion-title>Bookings</ion-title>
  </ion-navbar>

</ion-header>


<ion-content [ngClass]="{'light-theme': !isDarkTheme}">

  <div class="page-layout">

    <div class="page-fixed-header">
      <div class="header-container">
        <app-select-field [isDark]="isDarkTheme">
          <ion-item>
            <ion-select [(ngModel)]="selectedClubKey" (ionChange)="getAllActivity()">
              <ion-option *ngFor="let club of clubs" value={{club.FirebaseId}}>{{club.ClubName}}</ion-option>
            </ion-select>
          </ion-item>
        </app-select-field>

        <div class="filter-row">
          <app-select-field [isDark]="isDarkTheme">
            <ion-item>
              <ion-select [(ngModel)]="selectedActivity" (ionChange)="getAllCourts()">
                <ion-option *ngFor="let Activity of ActivityList" value={{Activity.$key}}>
                  {{Activity.ActivityName}}</ion-option>
              </ion-select>
            </ion-item>
          </app-select-field>

          <app-select-field [isDark]="isDarkTheme">
            <ion-item>
              <ion-select [(ngModel)]="selectedCourt" (ionChange)="callbothfunction()">
                <ion-option *ngFor="let court of courts" value={{court.$key}}>{{court.CourtName}}</ion-option>
                <ion-option value="all">All</ion-option>
              </ion-select>
            </ion-item>
          </app-select-field>
        </div>

        <app-search-bar placeholder="Search bookings" [count]="slotListing.length"
          (search)="getFilterItems($event)">
        </app-search-bar>
      </div>
    </div>

    <div class="page-scroll-area">
      <app-empty-state *ngIf="slotListing.length == 0" icon="calendar" [text]="NoActiveBooking">
      </app-empty-state>

      <div class="slot-list">
        <div class="slot-item" *ngFor="let slot of slotListing;let i = index">
          <app-checkbox [(checked)]="slot.IsSelect" color="#35adff"></app-checkbox>
          <primary-card accentColor="#35adff" (cardClick)="toggleSlotSelection(slot)">
            <div class="slot-card-content">
              <div class="slot-row">
                <span class="slot-name">{{slot.name}}</span>
                <span class="slot-time-badge">{{slot.slot_start_time}}</span>
              </div>
              <div class="slot-row">
                <span class="slot-detail">{{slot.slot_start_time}} - {{slot.slot_end_time}}</span>
                <span class="slot-detail">{{getTime(slot.booking_date)}}</span>
              </div>
              <div class="slot-row">
                <span class="slot-detail">{{slot.courtname}}</span>
                <span class="slot-price" *ngIf="currencyDetails!=undefined">
                  {{currencyDetails.CurrencySymbol}}{{slot.price}}</span>
              </div>
              <div class="slot-partner" *ngIf="slot.partnerAddedText">
                <span>{{slot.partnerAddedText}}</span>
              </div>
            </div>
          </primary-card>
        </div>
      </div>
    </div>

  </div>
</ion-content>
<ion-footer>
  <div class="footer-actions">
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-input type="text" placeholder="Type 'DELETE' here..." [(ngModel)]="deleteText"></ion-input>
      </ion-item>
    </app-form-field>
    <app-glass-button label="Cancel Booking" [disabled]="deleteText == '' ? true : false" (btnClick)="showConfirm()">
    </app-glass-button>
  </div>
</ion-footer>
