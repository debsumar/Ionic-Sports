<ion-header>
  <ion-navbar>
    <ion-title class="logo_center" text-center>
      Select Members
    </ion-title>
    <ion-buttons end>
          <button ion-button icon-only (click)="dismiss()" class="pop-over">
              <ion-icon name="close"></ion-icon>
          </button>
      </ion-buttons>
  </ion-navbar>
</ion-header>

<ion-content padding>
  <div class="page-fixed-header">
    <app-search-bar placeholder="Search" [count]="members?.length" (search)="getFilterItems($event)"></app-search-bar>
    <div class="section-header">
      <span class="section-title">Select Members</span>
    </div>
  </div>

  <div class="page-list-area">
    <app-list-card *ngFor="let member of members; let i = index">
      <div class="member-row">
        <div class="member-avatar">{{member.FirstName?.charAt(0)}}</div>
        <div class="member-info">
          <p class="member-name">{{member.FirstName}} {{member.LastName}} ({{(this.commonService.getAge(member.DOB))}})</p>
        </div>
        <ion-checkbox (ionChange)="selecteMembers(i,$event)"></ion-checkbox>
      </div>
    </app-list-card>

    <div class="empty-state" *ngIf="members?.length === 0">
      <ion-icon name="people" class="empty-icon"></ion-icon>
      <p class="empty-text">No members found</p>
    </div>
  </div>
</ion-content>
<ion-footer no-border>
  <app-glass-button label="Done" (btnClick)="dismiss()"></app-glass-button>
</ion-footer>
