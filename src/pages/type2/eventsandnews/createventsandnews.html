<ion-header no-border [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">
  <ion-navbar>
    <ion-title class="icontitle"> {{LangObj.create_news_title}} </ion-title>
  </ion-navbar>
</ion-header>



<ion-content [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">
  <div class="form-wrap">
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label floating>{{LangObj.create_news_header}}</ion-label>
        <ion-textarea type="text" rows="1" [(ngModel)]="inputObj.image_title" ></ion-textarea>
      </ion-item>
    </app-form-field>

    <div class="upload-card" (click)="SelectProfImg()">
      <div class="upload-placeholder" *ngIf="!title_url">
        <img class="default_tit_img" src="assets/images/img_placehlder.png">
        <p class="upload-label">Upload Title Image</p>
      </div>
      <div class="upload-preview" *ngIf="title_url">
        <img class="tit_img" src={{title_url}}>
      </div>
    </div>

    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label floating>{{LangObj.create_news_caption}}</ion-label>
        <ion-input type="text" [(ngModel)]="inputObj.image_caption"  ></ion-input>
      </ion-item>
    </app-form-field>

    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label floating>Description</ion-label>
        <ion-textarea class="desc_cls" rows="3" type="text"
          [(ngModel)]="inputObj.image_description" placeholder=" Type News Description..." (tap)="focusedOnTextArea()" >
        </ion-textarea>
      </ion-item>
    </app-form-field>

    <app-select-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label class="act">{{LangObj.create_news_activities}}</ion-label>
        <ion-select [(ngModel)]="selectedActivity">
          <ion-option *ngFor="let activity of activityList" value={{activity.ActivityKey}}>{{activity.ActivityName}}
          </ion-option>
        </ion-select>
      </ion-item>
    </app-select-field>

    <div class="row-item" (click)="presentProfileModal()">
      <ion-label class="text">{{LangObj.create_news_category}}</ion-label>
      <p class="cate para_overflow">{{getCategory()}}</p>
    </div>

    <div class="toggle-row">
      <p class="custom_toggle_para">Show in AP Play</p>
      <label class="custom_toggle">
        <input type="checkbox" [(ngModel)]="ImageObj.is_show_applus">
        <span data-unchecked="No" data-checked="Yes"></span>
      </label>
    </div>

    <div class="row-item" (click)="presentUploadModal()">
      <ion-label class="text">{{LangObj.create_news_addphoto}}</ion-label>
      <button class="btn">
        <ion-icon name="add" class="ico"></ion-icon>
      </button>
    </div>

    <div class="photo-grid" *ngIf="getPhotoList().length > 0">
      <img *ngFor="let photo of photoList;let i = index" src={{photo.ImageURL}} class="photo-thumb" (click)="presentActionSheet(i, photo)">
    </div>
  </div>
</ion-content>

<ion-footer [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">
  <div class="footer-actions">
    <button class="ghost-btn" (click)="resetVideo()">{{LangObj.create_news_cancel}}</button>
    <app-glass-button label="{{LangObj.create_news_save}}" (btnClick)="saveNewsAndPhoto()"></app-glass-button>
  </div>
</ion-footer>
