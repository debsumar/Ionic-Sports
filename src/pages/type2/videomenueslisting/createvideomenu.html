<ion-header no-border [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">

  <ion-navbar>
    <ion-title class="icontitle">{{LangObj.create_video_title}}</ion-title>
  </ion-navbar>

</ion-header>

<ion-content padding [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">

  <app-select-field>
    <ion-item>
      <ion-label class="act">{{LangObj.create_video_activities}}</ion-label>
      <ion-select [(ngModel)]="selectedActivity">
        <ion-option *ngFor="let activity of activityList" value={{activity.ActivityKey}}>{{activity.ActivityName}}</ion-option>
      </ion-select>
    </ion-item>
  </app-select-field>

  <app-form-field>
    <ion-item>
      <ion-input type="url" placeholder="{{LangObj.create_video_videourl}}" [(ngModel)]="videoData.video_url"></ion-input>
      <button ion-button clear item-right class="help_btn" (click)="showToaster()">
        <img style="width: 50%;" src="assets/images/info.svg">
      </button>
    </ion-item>
  </app-form-field>

  <app-form-field>
    <ion-item>
      <ion-label stacked>{{LangObj.create_video_header}}</ion-label>
      <ion-textarea type="text" rows="1" [(ngModel)]="videoData.video_title"></ion-textarea>
    </ion-item>
  </app-form-field>

  <app-form-field>
    <ion-item>
      <ion-textarea class="textarea description-area" type="text" rows="5" placeholder="Description" [(ngModel)]="videoData.video_description" (ionFocus)="focusedOnTextArea()"></ion-textarea>
    </ion-item>
  </app-form-field>

  <app-form-field>
    <ion-item>
      <ion-label stacked>{{LangObj.create_video_tag}}</ion-label>
      <ion-input type="text" [(ngModel)]="videoData.video_tag"></ion-input>
    </ion-item>
  </app-form-field>

  <ion-row class="toggle_row">
    <ion-col col-9 class="flex_col" style="margin:auto">
      <p class="custom_toggle_para">Show in AP Plus</p>
    </ion-col>
    <ion-col col-3>
      <label class="custom_toggle">
        <input type="checkbox" [(ngModel)]="videoData.is_show_applus">
        <span data-unchecked="No" data-checked="Yes"></span>
      </label>
    </ion-col>
  </ion-row>

</ion-content>

<ion-footer [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">
  <div class="footer-actions">
    <button class="ghost-btn" (click)="resetVideo()">{{LangObj.create_video_cancel}}</button>
    <app-glass-button label="{{LangObj.create_video_save}}" (btnClick)="addNewVideos()"></app-glass-button>
  </div>
</ion-footer>
