<ion-header>
  <ion-navbar>
    <button ion-button icon-only menuToggle (click)="goToDashboardMenuPage()">
      <ion-icon name="apps"></ion-icon>
    </button>
    <ion-title>Add School </ion-title>

    <ion-buttons end>
      <button ion-button icon-only (click)="goToDashboardMenuPage()">
                 <img src="assets/images/home.svg" class="home_btn">
            </button>
      <button ion-button icon-only (click)="presentPopover($event)"> 
        <ion-icon name="more"></ion-icon>
      </button>
    </ion-buttons>
  </ion-navbar>
</ion-header>
<ion-content [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">
  <ion-list>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>School Name</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.SchoolName"></ion-input>
      </ion-item>
    </app-form-field>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>School EmailID</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.SchoolEmailID"></ion-input>
      </ion-item>
    </app-form-field>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>First Line Address</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.FirstLineAddress"></ion-input>
      </ion-item>
    </app-form-field>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>Second Line Address</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.SecondLineAddress"></ion-input>
      </ion-item>
    </app-form-field>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>City</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.City"></ion-input>
      </ion-item>
    </app-form-field>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>Post Code</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.PostCode"></ion-input>
      </ion-item>
    </app-form-field>
    <app-form-field [isDark]="isDarkTheme">
      <ion-item>
        <ion-label stacked>School Contact Number</ion-label>
        <ion-input type="text" [(ngModel)]="schoolSetupObj.SchoolContactNumber"></ion-input>
      </ion-item>
    </app-form-field>
  </ion-list>
</ion-content>
<ion-footer no-border [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme">
  <app-glass-button label="Save" (btnClick)="saveSchoolSetup()"></app-glass-button>
</ion-footer>
