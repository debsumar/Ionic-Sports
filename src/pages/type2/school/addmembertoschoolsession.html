<ion-header *ngIf="themeType == 1">
    <ion-navbar>
        <button ion-button menuToggle>
      <ion-icon name="menu"></ion-icon>
    </button>
        <ion-title>Add Memebr</ion-title>
        <ion-buttons end>
            <button ion-button icon-only (click)="presentPopover($event)">
        <ion-icon name="more"></ion-icon>
      </button>
        </ion-buttons>
    </ion-navbar>
</ion-header>
<ion-header>
    <ion-navbar *ngIf="themeType == 2">
        <button ion-button icon-only menuToggle (click)="goToDashboardMenuPage()">
      <ion-icon name="apps"></ion-icon>
    </button>
        <ion-title>
            Add Member
        </ion-title>
        <ion-buttons end>
            <button ion-button icon-only (click)="goToDashboardMenuPage()">
                 <img src="assets/images/home.svg" class="home_btn">
            </button>

            <button ion-button icon-only (click)="presentPopover($event)">
        <ion-icon name="more"></ion-icon>
      </button>
        </ion-buttons>
    </ion-navbar>
</ion-header>

<ion-content class="cards-bg social-cards" [ngClass]="isDarkTheme ? 'dark-theme' : 'light-theme'">
    <div class="page-fixed-header">
        <app-search-bar placeholder="Search by name" [count]="filteredMembers?.length" (search)="getFilterItems($event)"></app-search-bar>
        <div class="section-header">
            <span class="section-title">Member Lists</span>
        </div>
    </div>


    <!-- <ion-scroll scrollY="true" class="block_height1"> -->
        <!-- <ion-list class="margin">
            <ion-item *ngFor="let member of members;let i = index">
                <ion-label>{{member.DisplayName}} ({{member.Age}})</ion-label>
                <ion-checkbox [(ngModel)]="member.isSelect " [checked]="member.isSelect" [disabled]="member.isAlreadySelected" (ionChange)="selecteMembers(member)"></ion-checkbox>
            </ion-item>
        </ion-list> -->

        <div class="page-list-area">
            <app-list-card *ngFor="let member of filteredMembers;let i = index"
                [accentColor]="member.isAlreadExisted ? '#64748b' : (member.isSelected ? '#10b981' : '#2b92bb')">
                <div class="member-row">
                    <div class="member-avatar">{{member.FirstName?.charAt(0)}}</div>
                    <div class="member-info">
                        <p class="member-name">{{member.FirstName}} {{member.LastName}} ({{this.commonService.calculateAgeFromDOB(member.DOB)}})</p>
                        <span class="member-tag existing" *ngIf="member.isAlreadExisted">Already Added</span>
                    </div>
                    <ion-checkbox [(ngModel)]="member.isSelected" [disabled]="member.isAlreadExisted" (ionChange)="toggleMember(member,$event)"></ion-checkbox>
                </div>
            </app-list-card>

            <div class="empty-state" *ngIf="filteredMembers?.length === 0">
                <ion-icon name="people" class="empty-icon"></ion-icon>
                <p class="empty-text">No members found</p>
            </div>
        </div>

<ion-footer [ngClass]="isDarkTheme ? 'dark-theme' : 'light-theme'">
    <app-glass-button [label]="'Add Members (' + schoolSesEnrolDets.enrol_users.length + ')'"
        [disabled]="schoolSesEnrolDets.enrol_users.length == 0"
