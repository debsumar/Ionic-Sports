<ion-content class="login-content">
    <div class="login-wrapper">
        <div class="overlay"></div>

        <div class="form-card">
            <div class="logo-row">
                <img src="assets/images/logo.svg" class="brand-logo" alt="ActivityPro" />
                <span class="brand-name">ActivityPro</span>
            </div>

            <h1 class="login-title">Reset password</h1>
            <p class="login-subtitle">Enter your email to receive a reset link</p>

            <ion-grid class="login-form">
                <ion-row class="input-row">
                    <ion-col col-12>
                        <ion-label class="field-label">Email</ion-label>
                        <div class="input-wrap">
                            <ion-input type="email" inputmode="email" autocomplete="email" [(ngModel)]="clubObj.EmailID" placeholder="you@example.com" id="admin_input" name="admin_input"></ion-input>
                            <ion-icon name="mail" class="input-icon"></ion-icon>
                        </div>
                    </ion-col>
                </ion-row>

                <ion-row>
                    <ion-col col-12>
                        <button ion-button block class="login-btn" (click)="setPassword()">Reset Password</button>
                    </ion-col>
                </ion-row>

                <ion-row>
                    <ion-col col-12 text-center>
                        <span (click)="goToLogin()" class="back-link">Back to Login</span>
                    </ion-col>
                </ion-row>
            </ion-grid>
        </div>
    </div>
</ion-content>
